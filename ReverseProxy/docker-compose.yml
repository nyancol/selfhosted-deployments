services:
  caddy:
    container_name: reverse_proxy_caddy
    image: ghcr.io/authcrunch/authcrunch:v1.0.28
    env_file: .env
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - caddy_public
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA}/caddy_data:/data
      - ${CADDY_DATA}/caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: reverse_proxy_cloudflared
    restart: unless-stopped
    networks:
      - caddy_public
    depends_on:
      - caddy
    command: tunnel run --config /etc/cloudflared/config.yml
    env_file:
      - .env
    volumes:
      - ./cloudflared:/etc/cloudflared

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    restart: unless-stopped
    env_file: .env
    networks:
      - caddy_public
    ports:
      - 1411:1411
    volumes:
      - "${POCKET_ID_DATA}/data:/app/data"
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

networks:
  caddy_public:
    driver: bridge
    name: "caddy_public"
