services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:latest
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "4096:4096"
    devices:
      - /dev/fuse:/dev/fuse
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
    networks:
      - caddy_public
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/zerobyte:/var/lib/zerobyte
      - ${DATA_DIR}/immich-data:/immich-data
      - ${DATA_DIR}/vaultwarden-data:/vaultwarden-data
      - ${DATA_DIR}/pocket-id-data/:/pocket-id-data
      - ${DATA_DIR}/caddy-data/:/caddy-id-data
      # Places prod SQLite (named volume from the places stack, read-only:
      # restic snapshots app.db + -wal + -shm together; SQLite replays WAL on restore).
      - places_places-data:/places-data:ro

networks:
  caddy_public:
    driver: bridge
    name: "caddy_public"

# Named volume owned by the places stack (project `places`, volume `places-data`).
# External: zerobyte never creates or writes it (ro mount above).
volumes:
  places_places-data:
    external: true
