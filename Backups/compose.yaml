services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:latest
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "4096:4096"
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      - TZ=Europe/Paris
    networks:
      - caddy_public
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/zerobyte:/var/lib/zerobyte
      - /home/yann/nextcloud/immish_lib:/immish-data
      - /home/yann/Documents/selfhosted-deployments/VaultWarden/vw-data:/vw-data

networks:
  caddy_public:
    driver: bridge
    name: "caddy_public"
