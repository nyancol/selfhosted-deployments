services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:latest
    container_name: zerobyte
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "4096:4096"
    devices:
      - /dev/fuse:/dev/fuse
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
    networks:
      - caddy_public
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/lib/zerobyte:/var/lib/zerobyte
      - ${DATA_DIR}/immich-data:/immich-data
      - ${DATA_DIR}/vaultwarden-data:/vw-data
      - ${DATA_DIR}/pocket-id-data/:/pocket-id
      - ${DATA_DIR}/caddy-data/:/pocket-id

networks:
  caddy_public:
    driver: bridge
    name: "caddy_public"
