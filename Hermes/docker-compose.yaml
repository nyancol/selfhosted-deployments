services:
  hermes:
    # image: nousresearch/hermes-agent:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    # user: "1000:1000"
    ports:
      - "8642:8642"
    volumes:
      - /home/yann/.hermes:/opt/data
    # network_mode: host
    networks:
      - hermes-net
    environment:
      - HERMES_DATA_DIR=/opt/data
      - HOME=/home/hermes_user
      - HERMES_STREAM_STALE_TIMEOUT=540
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  dashboard:
    # build:
    #   context: .
    #   dockerfile: ./Dockerfile
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    ports:
      - "9119:9119"
    volumes:
      - /home/yann/.hermes:/opt/data
    environment:
      - GATEWAY_HEALTH_URL=http://hermes:8642
    networks:
      - hermes-net
    depends_on:
      - hermes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  hermes-net:
    driver: bridge
